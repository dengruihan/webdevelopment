<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <span id="S1">张三</span>
        <span id="S2">李四</span>
        <span id="S3">王五</span>
        <span id="S4">赵六</span>
    </div>

    <div class="document">
        <h2>学生信息</h2>
        <div id="studentInfo">
            请点击上方学生标签查看详细信息
        </div>
    </div>

    <script>
        // 学生数据
        const students = {
            'S1': { name: '张三', age: 18, grade: '高三', class: '1班' },
            'S2': { name: '李四', age: 17, grade: '高二', class: '2班' },
            'S3': { name: '王五', age: 18, grade: '高三', class: '3班' },
            'S4': { name: '赵六', age: 17, grade: '高二', class: '4班' }
        };

        var studentInfo = document.getElementById('studentInfo');
        var spans = document.getElementsByTagName('span');
        
        for (var i = 0; i < spans.length; i++) {
            spans[i].onclick = function() {
                var student = students[this.id];
                studentInfo.innerHTML = `
                    <p>姓名：${student.name}</p>
                    <p>年龄：${student.age}</p>
                    <p>年级：${student.grade}</p>
                    <p>班级：${student.class}</p>
                `;
            }
        }
    </script>

</body>
</html>
