<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历 - {{ profile.name }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            line-height: 1.6;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ccc;
        }
        
        .photo-section {
            flex: 0 0 200px;
            padding-right: 30px;
        }
        
        .photo {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border: 1px solid #ddd;
            background-color: #f5f5f5; /* 添加背景色 */
        }
        
        .info-section {
            flex: 1;
            padding-top: 20px;
        }
        
        .info-item {
            margin-bottom: 15px;
        }
        
        .info-label {
            font-weight: bold;
            margin-right: 10px;
        }
        
        .content {
            margin-top: 20px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 2px solid black;
            padding-bottom: 5px;
        }
        
        .section-content {
            margin-left: 20px;
        }
        
        .experience-item {
            margin-bottom: 20px;
        }
        
        .experience-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .experience-date {
            color: #666;
            font-style: italic;
            margin-bottom: 5px;
        }
        
        .experience-description {
            margin-left: 20px;
        }
        
        .nav {
            margin-bottom: 20px;
            text-align: center;
        }
        
        .nav a {
            margin: 0 10px;
            text-decoration: none;
            color: #007bff;
            padding: 5px 10px;
            border: 1px solid #007bff;
            border-radius: 3px;
        }
        
        .nav a:hover {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">自己</a>
            <a href="/a">同学A</a>
            <a href="/b">同学B</a>
            <a href="/c">同学C</a>
        </div>
        
        <div class="header">
            <div class="photo-section">
                <img src="{{ profile.photo }}" alt="个人照片" class="photo" >
            </div>
            <div class="info-section">
                <div class="info-item">
                    <span class="info-label">Name:</span>
                    <span>{{ profile.name }}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Age:</span>
                    <span>{{ profile.age }}</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Hobby:</span>
                    <span>{{ profile.hobby }}</span>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="section">
                <h2 class="section-title">Brief</h2>
                <div class="section-content">
                    <p>{{ profile.brief }}</p>
                </div>
            </div>
            
            <div class="section">
                <h2 class="section-title">Experience</h2>
                <div class="section-content">
                    {% for exp in profile.experiences %}
                    <div class="experience-item">
                        <div class="experience-title">{{ exp.title }}</div>
                        <div class="experience-date">{{ exp.date }}</div>
                        <div class="experience-description">
                            {{ exp.description }}
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
